name: Oz Verify
# Reusable workflow that runs end-to-end verification on a pull request via the
# Oz agent. It discovers any "verification" skills present in the repository
# (skills under `.agents/skills/verify-*/SKILL.md`), executes them against the
# PR's HEAD, and posts a consolidated report comment back on the PR.
#
# This workflow is intentionally self-contained: it calls
# `warpdotdev/oz-agent-action` directly and does not depend on the shared
# Python helpers used by the rest of this repository's workflows, so downstream
# repositories can adopt `/oz-verify` with nothing more than a lightweight
# adapter workflow, a `WARP_API_KEY` secret, and (optionally) their own
# `verify-*` skills.
on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to verify.
        required: true
        type: string
      comment_id:
        description: Issue comment ID that triggered the run (used for an acknowledging reaction).
        required: false
        default: ""
        type: string
      requester:
        description: Login of the user who requested verification.
        required: false
        default: ""
        type: string
      skill_filter:
        description: Optional argument to `/oz-verify` used to target a specific verification skill by name.
        required: false
        default: ""
        type: string
    secrets:
      WARP_API_KEY:
        required: true
jobs:
  verify:
    name: Run Oz verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Acknowledge trigger comment
        if: inputs.comment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="eyes" || true
      - name: Checkout PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "${{ inputs.pr_number }}"
          git --no-pager log -1 --oneline
      - name: Construct verification prompt
        id: prompt
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTER: ${{ inputs.requester }}
          SKILL_FILTER: ${{ inputs.skill_filter }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import textwrap

          pr_number = os.environ["PR_NUMBER"]
          repository = os.environ["REPOSITORY"]
          requester = (os.environ.get("REQUESTER") or "").strip()
          skill_filter = (os.environ.get("SKILL_FILTER") or "").strip()
          run_url = os.environ.get("RUN_URL", "")

          requester_line = (
              f"Requested by @{requester} via `/oz-verify`."
              if requester
              else "Triggered by `/oz-verify`."
          )
          filter_line = (
              f"Only run the verification skill named `{skill_filter}`."
              if skill_filter
              else "Run every verification skill that applies."
          )

          prompt = textwrap.dedent(
              f"""
              You are running the `verify-pr` skill against pull request #{pr_number}
              in {repository}. {requester_line}

              {filter_line}

              Follow the `verify-pr` skill's instructions exactly:
              1. Discover verification skills in the repository.
              2. Run the verification skills against the checked-out PR HEAD.
              3. Write a consolidated markdown report to `verification_report.md`
                 at the repository root. The report must list each skill that
                 ran, its pass/fail status, and any output or artifacts worth
                 linking.
              4. Post the report back to the PR as a new comment. Include a
                 link to this workflow run ({run_url}) at the bottom of the
                 comment so reviewers can jump to logs.
              5. Do not push commits or modify tracked files; verification is
                 read-only by default.
              """
          ).strip()

          print("prompt<<PROMPT_EOF")
          print(prompt)
          print("PROMPT_EOF")
          PY
      - name: Run Oz verification agent
        uses: warpdotdev/oz-agent-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          skill: verify-pr
          prompt: ${{ steps.prompt.outputs.prompt }}
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          model: ${{ vars.WARP_AGENT_MODEL || '' }}
          mcp: ${{ vars.WARP_AGENT_MCP || '' }}
          name: "Oz Verify PR #${{ inputs.pr_number }}"
      - name: Fallback report if the agent did not post one
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # If the agent already posted the report there is nothing to do.
          # When the agent failed mid-run we still want to leave a pointer
          # back to the workflow logs so contributors aren't left guessing.
          if [ -f verification_report.md ]; then
            echo "Agent produced verification_report.md; the skill is responsible for posting it."
            exit 0
          fi
          body=$(printf '⚠️ The `/oz-verify` run did not produce a verification report.\n\nSee the [workflow run logs](%s) for details.' "$RUN_URL")
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f "body=$body" || true
