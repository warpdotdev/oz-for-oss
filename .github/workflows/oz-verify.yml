name: Oz Verify
# Reusable workflow that runs end-to-end verification on a pull request via
# the Oz agent. The orchestration loop lives in `.github/scripts/oz_verify.py`
# so the workflow itself is a thin shell that checks out the PR, sets up the
# shared Oz Python environment, and hands off to the script. The script
# discovers every skill whose frontmatter sets `verification: "true"` under
# its top-level `metadata` map, runs each one as its own Oz agent run,
# resolves signed download URLs for any screenshot or video artifacts via
# the Oz SDK, and posts a consolidated report comment back on the PR with
# those artifacts embedded inline.
on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to verify.
        required: true
        type: string
      comment_id:
        description: Issue comment ID that triggered the run (used for an acknowledging reaction).
        required: false
        default: ""
        type: string
      requester:
        description: Login of the user who requested verification.
        required: false
        default: ""
        type: string
      skill_filter:
        description: Optional argument to `/oz-verify` used to target a specific verification skill by name.
        required: false
        default: ""
        type: string
    secrets:
      OZ_MGMT_GHA_APP_ID:
        required: true
      OZ_MGMT_GHA_PRIVATE_KEY:
        required: true
      WARP_API_KEY:
        required: true
jobs:
  verify:
    name: Run Oz verification
    runs-on: ubuntu-slim
    env:
      WORKFLOW_CODE_REPOSITORY: warpdotdev/oz-for-oss
      WORKFLOW_CODE_REF: ${{ github.repository == 'warpdotdev/oz-for-oss' && github.sha || 'main' }}
      WORKFLOW_CODE_PATH: __oz_shared
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OZ_MGMT_GHA_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.OZ_MGMT_GHA_PRIVATE_KEY }}
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
      - name: Checkout workflow code
        uses: actions/checkout@v5
        with:
          repository: ${{ env.WORKFLOW_CODE_REPOSITORY }}
          ref: ${{ env.WORKFLOW_CODE_REF }}
          path: ${{ env.WORKFLOW_CODE_PATH }}
          token: ${{ steps.app_token.outputs.token }}
      - name: Authenticate to Google Cloud for staging secret access
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/643991131484/locations/global/workloadIdentityPools/github-actions/providers/warp-terraform
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Resolve staging origin token
        id: staging_origin_token
        run: |
          token="$(gcloud --project=warp-server-staging secrets versions access latest --secret=staging-origin-token)"
          printf '::add-mask::%s\n' "$token"
          {
            echo 'token<<EOF'
            printf '%s\n' "$token"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set up Oz Python environment
        uses: warpdotdev/oz-for-oss/.github/actions/setup-oz-python@main
        with:
          requirements-path: ${{ env.WORKFLOW_CODE_PATH }}/.github/scripts/requirements.txt
      - name: Run Oz verification workflow
        env:
          PYTHONPATH: ${{ env.WORKFLOW_CODE_PATH }}/.github/scripts
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          REQUESTER: ${{ inputs.requester }}
          SKILL_FILTER: ${{ inputs.skill_filter }}
          WARP_API_KEY: ${{ secrets.WARP_API_KEY }}
          WARP_AGENT_MODEL: ${{ vars.WARP_AGENT_MODEL || '' }}
          WARP_AGENT_MCP: ${{ vars.WARP_AGENT_MCP || '' }}
          WARP_ENVIRONMENT_ID: ${{ vars.WARP_ENVIRONMENT_ID || '' }}
          WARP_API_BASE_URL: https://staging.warp.dev/api/v1
          WARP_ORIGIN_TOKEN_ENV_NAME: STAGING_ORIGIN_TOKEN
          STAGING_ORIGIN_TOKEN: ${{ steps.staging_origin_token.outputs.token }}
        run: python "${{ env.WORKFLOW_CODE_PATH }}/.github/scripts/oz_verify.py"
